
name: Matrix UI checks

on:
  push:
    paths:
      - "webui/**"
      - "docs/**"
      - "tests/**"
      - "README.md"
      - ".github/workflows/ui-checks.yml"

  pull_request:
    paths:
      - "webui/**"
      - "docs/**"
      - "tests/**"
      - "README.md"
      - ".github/workflows/ui-checks.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-ui-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail

          test -s webui/index.html
          test -s webui/styles.css
          test -s webui/app.js
          test -s webui/runtime-contract.js
          test -s webui/connection.js
          test -s docs/ARCHITECTURE.md
          test -s docs/SECURITY.md
          test -s docs/FEATURE-MATRIX.md

          grep -Fqi 'no device connected' webui/index.html
          grep -Fq 'SIMULATION ONLY' webui/index.html

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          node --check webui/app.js
          node --check webui/runtime-contract.js
          node --check webui/connection.js
          node --check tests/contract-checks.js

      - name: Run contract invariants
        shell: bash
        run: |
          set -euo pipefail
          node tests/contract-checks.js

      - name: Check for accidental remote script imports
        shell: bash
        run: |
          set -euo pipefail

          if grep -Ein '<script[^>]+src[[:space:]]*=[[:space:]]*["'\''][^"'\'']*https?://' webui/index.html; then
            echo "Remote script import found; review before merge."
            exit 1
          fi

      - name: Check that UI is not misrepresented as live
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'UI PROTOTYPE' webui/index.html
          grep -Fqi 'not connected' webui/index.html
          grep -Fq 'no Android or runtime setting was changed' webui/app.js
